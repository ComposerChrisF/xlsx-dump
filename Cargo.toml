[package]
name = "xlsx-dump"
version = "0.2.2"
edition = "2024"
rust-version = "1.91"
description = "Dump spreadsheet workbooks (.xlsx, .xls, .ods) to CSV and JSON — values and formulas — for agents and spreadsheet apps."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ComposerChrisF/xlsx-dump"
homepage = "https://github.com/ComposerChrisF/xlsx-dump"
readme = "README.md"
keywords = ["cli", "xlsx", "spreadsheet", "csv", "excel"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md", "DESIGN.md", "TODO.md", ".github/", ".claude/", "docs/", "bugs/", "plans/"]

[lib]
name = "xlsx_dump"
path = "src/lib.rs"

[[bin]]
name = "xlsx-dump"
path = "src/main.rs"

[dependencies]
anyhow = "1"
calamine = "0.36.1"
clap = { version = "4.5", features = ["derive", "string"] }
cli-contract = { version = "0.5.1", path = "../cli-contract" }
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-normalization = "0.1.25"

[dev-dependencies]
assert_cmd = "2"
cfb = "0.15"
pretty_assertions = "1.4"
rust_xlsxwriter = "0.99.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# The reader can panic on a malformed binary record; `workbook.rs` catches that per call and
# reports the file (exit 1).  `abort` would turn it back into a crash.
[profile.release]
panic = "unwind"
