[package]
name = "xlsx-dump"
version = "0.2.5"
edition = "2024"
rust-version = "1.91"
description = "Dump spreadsheet workbooks (.xlsx, .xls, .ods) to CSV and JSON — values and formulas — for agents and spreadsheet apps."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ComposerChrisF/xlsx-dump"
readme = "README.md"
keywords = ["cli", "xlsx", "spreadsheet", "csv", "excel"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md", "DESIGN.md", "TODO.md", ".github/", ".claude/", "docs/", "bugs/", "plans/"]

[lib]
name = "xlsx_dump"
path = "src/lib.rs"

[[bin]]
name = "xlsx-dump"
path = "src/main.rs"

[dependencies]
anyhow = "1"
calamine = "0.36.1"
clap = { version = "4.5", features = ["derive", "string"] }
cli-contract = { version = "0.6", features = ["clap"] }
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-normalization = "0.1.25"

[dev-dependencies]
assert_cmd = "2"
cfb = "0.15"
pretty_assertions = "1.4"
rust_xlsxwriter = "0.99.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# The reader can panic on a malformed binary record; `workbook.rs` catches that per call and
# reports the file (exit 1).  `abort` would turn it back into a crash.
[profile.release]
panic = "unwind"

# house-lints v1 (2026-11-14) — the [lints] table, to paste into Cargo.toml.
# A single crate: paste as is.  A workspace: rename the table to
# [workspace.lints.clippy] in the root manifest, and put `[lints] workspace = true`
# in each member.  Every level is "warn": existing violations do not block, and
# review refuses new ones.  The canonical copy lives in Chris's coding hub, under
# house-lints/.

[lints.clippy]
# Every suppression says why, and an #[expect] warns once its lint stops firing.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# No panics on input in production code (tests are allowed by clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Each of these caught a filed bug in the 2026-11-14 census.
string_slice = "warn"
let_underscore_must_use = "warn"
undocumented_unsafe_blocks = "warn"
# disallowed_methods is on by default; its list is clippy.toml.
